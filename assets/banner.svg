<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(88,166,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Terminal Window -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    <rect width="500" height="380" rx="12" fill="url(#code)" stroke="rgba(88,166,255,0.3)" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="500" height="36" rx="12" fill="#161b22"/>
    <rect y="12" width="500" height="24" fill="#161b22"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text x="250" y="22" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">Terminal</text>

    <!-- Code content -->
    <text x="20" y="70" fill="#7ee787" font-family="monospace" font-size="14">$ <tspan fill="#58a6ff">devflow</tspan> setup</text>
    <text x="20" y="100" fill="#8b949e" font-family="monospace" font-size="12">Analyzing project...</text>
    <text x="20" y="125" fill="#7ee787" font-family="monospace" font-size="12">[OK] Project analyzed</text>

    <text x="20" y="165" fill="#7ee787" font-family="monospace" font-size="14">$ <tspan fill="#58a6ff">devflow</tspan> plan "Add auth"</text>
    <text x="20" y="195" fill="#8b949e" font-family="monospace" font-size="12">[1] Step 1: Create auth module</text>
    <text x="20" y="215" fill="#8b949e" font-family="monospace" font-size="12">[2] Step 2: Add middleware</text>
    <text x="20" y="235" fill="#8b949e" font-family="monospace" font-size="12">[3] Step 3: Update routes</text>

    <text x="20" y="275" fill="#7ee787" font-family="monospace" font-size="14">$ <tspan fill="#58a6ff">devflow</tspan> check</text>
    <text x="20" y="305" fill="#7ee787" font-family="monospace" font-size="12">[OK] Tests passed (21/21)</text>
    <text x="20" y="325" fill="#7ee787" font-family="monospace" font-size="12">[OK] Lint passed</text>

    <text x="20" y="360" fill="#7ee787" font-family="monospace" font-size="14">$ <tspan fill="#58a6ff">_</tspan></text>
  </g>

  <!-- Title and Description -->
  <g transform="translate(620, 120)">
    <!-- Logo icon -->
    <g transform="translate(0, 0)">
      <rect width="80" height="80" rx="16" fill="url(#accent)" filter="url(#glow)"/>
      <text x="40" y="55" text-anchor="middle" fill="#fff" font-family="monospace" font-size="36" font-weight="bold">DF</text>
    </g>

    <!-- Title -->
    <text x="100" y="35" fill="#fff" font-family="system-ui, sans-serif" font-size="48" font-weight="bold">
      <tspan fill="url(#accent)">DevFlow</tspan> CLI
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">
      AI-Powered Developer Assistant
    </text>

    <!-- Features -->
    <g transform="translate(0, 120)">
      <circle cx="8" cy="8" r="4" fill="#58a6ff"/>
      <text x="24" y="14" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="16">Project Analysis and Planning</text>

      <circle cx="8" cy="48" r="4" fill="#a371f7"/>
      <text x="24" y="54" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="16">Safe File Modifications</text>

      <circle cx="8" cy="88" r="4" fill="#3fb950"/>
      <text x="24" y="94" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="16">Test and Lint Automation</text>

      <circle cx="8" cy="128" r="4" fill="#f0883e"/>
      <text x="24" y="134" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="16">PR Draft Generation</text>

      <circle cx="8" cy="168" r="4" fill="#58a6ff"/>
      <text x="24" y="174" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="16">Multi-LLM Provider Support</text>
    </g>

    <!-- Provider badges -->
    <g transform="translate(0, 320)">
      <rect width="70" height="28" rx="14" fill="rgba(88,166,255,0.2)" stroke="#58a6ff" stroke-width="1"/>
      <text x="35" y="19" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">Ollama</text>

      <rect x="80" width="70" height="28" rx="14" fill="rgba(163,113,247,0.2)" stroke="#a371f7" stroke-width="1"/>
      <text x="115" y="19" text-anchor="middle" fill="#a371f7" font-family="monospace" font-size="11">OpenAI</text>

      <rect x="160" width="70" height="28" rx="14" fill="rgba(63,185,80,0.2)" stroke="#3fb950" stroke-width="1"/>
      <text x="195" y="19" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="11">Claude</text>

      <rect x="240" width="70" height="28" rx="14" fill="rgba(240,136,62,0.2)" stroke="#f0883e" stroke-width="1"/>
      <text x="275" y="19" text-anchor="middle" fill="#f0883e" font-family="monospace" font-size="11">Gemini</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect y="590" width="1200" height="40" fill="rgba(0,0,0,0.3)"/>
  <text x="600" y="615" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="14">
    github.com/husam20264-cmd/DevFlow-CLI
  </text>

  <!-- Stats -->
  <g transform="translate(60, 595)">
    <text fill="#7ee787" font-family="monospace" font-size="12">21 Tests</text>
    <text x="120" fill="#58a6ff" font-family="monospace" font-size="12">MIT License</text>
    <text x="260" fill="#a371f7" font-family="monospace" font-size="12">5 LLM Providers</text>
  </g>
</svg>
